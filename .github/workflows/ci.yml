name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same branch — saves compute on quick succession of pushes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: pytest + ruff + pre-commit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          # Cache the resolved venv across runs keyed on uv.lock — keeps cold
          # starts under ~10s once the cache warms.
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python 3.12
        # The project pins requires-python = ">=3.12"; CI runs against the
        # floor (3.12) so we catch any accidental use of newer syntax/stdlib.
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Lint (ruff check)
        run: uv run ruff check .

      - name: Format check (ruff format)
        run: uv run ruff format --check .

      - name: Run pre-commit hooks
        # nbstripout in particular: catches notebooks that landed with outputs.
        run: uv run pre-commit run --all-files

      - name: Run pytest
        # The integration test in tests/integration/ relies on `git` and a
        # PATH-injected `gh` mock; the real GitHub CLI is not required.
        run: uv run pytest -q
