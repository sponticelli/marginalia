<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Marginalia — quick capture</title>
<style>
    body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        font-size: 13px;
        margin: 0;
        padding: 12px;
        width: 300px;
        background: #fafaf8;
        color: #222;
    }
    h1 { font-size: 14px; margin: 0 0 8px 0; font-weight: 600; }
    label { display: block; margin-top: 8px; font-weight: 500; color: #555; }
    input {
        width: 100%;
        box-sizing: border-box;
        padding: 6px 8px;
        margin-top: 4px;
        border: 1px solid #d0d0cc;
        border-radius: 4px;
        font-size: 12px;
        font-family: inherit;
    }
    button {
        margin-top: 10px;
        padding: 6px 12px;
        background: #2c5b89;
        color: white;
        border: 0;
        border-radius: 4px;
        font-size: 12px;
        cursor: pointer;
    }
    button:hover { background: #244a72; }
    button.secondary { background: transparent; color: #2c5b89; padding: 6px 0; }
    .status { margin-top: 10px; font-size: 12px; min-height: 1.2em; }
    .status.ok { color: #2a7a3a; }
    .status.err { color: #a02020; }
    .config { display: none; margin-top: 12px; padding-top: 10px; border-top: 1px solid #e0e0dc; }
    .config.shown { display: block; }
    .url { font-size: 11px; color: #888; margin-top: 6px; word-break: break-all; }
</style>
</head>
<body>
    <h1>Send to Marginalia</h1>
    <div class="url" id="url">(loading…)</div>
    <button id="send">Send page</button>
    <button id="settings-toggle" class="secondary">Settings</button>
    <div class="status" id="status"></div>

    <div class="config" id="config">
        <label for="endpoint">Endpoint</label>
        <input id="endpoint" type="text" placeholder="http://127.0.0.1:7777">
        <label for="token">Auth token</label>
        <input id="token" type="password"
               placeholder="from `marginalia serve --init-token`">
        <button id="save">Save</button>
    </div>

    <script src="popup.js"></script>
</body>
</html>
